<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sentiment Analysis</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            margin-bottom: 25px;
        }

        textarea {
            width: 90%;
            height: 120px;
            padding: 15px;
            font-size: 16px;
            resize: none;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #eeeeee;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Sentiment Analysis</h1>

        <form action="/predict" method="POST">

            <textarea name="review" placeholder="Enter your review here..." required></textarea>

            <br>

            <button type="submit">
                Analyze Sentiment
            </button>

        </form>


        {% if sentiment %}

        <div class="result">

            <h2>Result</h2>

            <p>
                <b>Review:</b> {{ review }}
            </p>

            <h2>
                {{ sentiment }}
            </h2>

            <p>
                Confidence: {{ probability }}%
            </p>

        </div>

        {% endif %}

    </div>

</body>

</html>
